name = "varvar-menu"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_als"] # 🏪 контекст закладу в запиті (venue.js)
workers_dev = true # стара адреса varvar-menu.varvar.workers.dev лишається (боти, принтер, каси)
# 🌐 ATOM: власний домен — сайт закладів posatom.online/<заклад>/
routes = [
  { pattern = "posatom.online", custom_domain = true },
  { pattern = "www.posatom.online", custom_domain = true },
]

[vars]
ALLOWED_ORIGIN = "https://666blackmuxa666.github.io,https://posatom.online,http://localhost:8000"
TABLES = "15"
SELF_URL = "https://varvar-menu.varvar.workers.dev"
SITE_URL = "https://666blackmuxa666.github.io/VARVAR/"

# створіть: npx wrangler kv namespace create DB  → вставте id нижче
[[kv_namespaces]]
binding = "DB"
id = "279c013ca4564083a7f56326a2855bbd"

# черга друку (миттєва доставка чеків на принтер)
[[durable_objects.bindings]]
name = "PRINTQ"
class_name = "PrintQ"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrintQ"]

# сховище закладу (столи, звіти, каса) — без затримок KV
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Store"]

# 🌐 HUB платформи: акаунти власників, заклади, сесії кабінету
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Hub"]

# ⏰ нагадування про броні й відгуки
[triggers]
crons = ["*/5 * * * *"]
