<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="color-scheme" content="dark only">
<title>VARVAR — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
<header class="top">
  <h1 class="logo">VARVAR</h1>
  <button class="lang" id="lang" aria-label="Language">EN</button>
  <div class="langs" id="langs" hidden></div>
</header>
<nav class="cats" id="cats"></nav>
<div class="wifi-banner" id="wifiBanner" hidden></div>
<main id="menu"></main>
<footer class="foot" data-i18n="thanks"></footer>

<div class="order-status" id="orderStatus" hidden></div>
<button class="fab" id="fab" hidden><span id="fabCount">0</span><b id="fabSum"></b></button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <section class="sheet-body" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 data-i18n="cart"></h2><button class="x" data-close aria-label="close">✕</button></div>
    <div id="cartList"></div>
    <textarea id="comment" rows="2" data-i18n-ph="comment"></textarea>
    <label class="table-row"><span data-i18n="table"></span><select id="table"></select></label>
    <div id="history"></div>
    <div class="msg" id="msg"></div>
    <div class="actions" id="actions"></div>
  </section>
</div>

<div class="modal" id="payModal" hidden>
  <div class="sheet-bg" data-close></div>
  <section class="modal-body">
    <h2 data-i18n="payTitle"></h2>
    <button class="btn" data-pay="cash" data-i18n="payCash"></button>
    <button class="btn" data-pay="card" data-i18n="payCard"></button>
  </section>
</div>

<div class="modal" id="wifiModal" hidden>
  <div class="sheet-bg" data-close></div>
  <section class="modal-body">
    <h2 data-i18n="wifiTitle"></h2>
    <p data-i18n="wifiText"></p>
    <div class="wifi-card"><div>Wi‑Fi: <b id="wSsid"></b></div><div id="wPassRow"><span data-i18n="password"></span>: <b id="wPass"></b></div></div>
    <button class="btn" id="copyPass" data-i18n="copy"></button>
    <button class="btn ghost" id="retry" data-i18n="retry"></button>
  </section>
</div>

<script src="js/config.js?v=9"></script>
<script src="js/i18n.js?v=14"></script>
<script src="js/menu-i18n.js?v=1"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
